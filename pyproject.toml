[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fftkit"
version = "0.1.0"
description = "One FFT API over many backends: scipy, numpy, Intel MKL, CuPy, PyTorch, TensorFlow, pyFFTW, Accelerate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Ricardo Frantz", email = "rasfrantz@gmail.com" },
]
keywords = [
    "FFT",
    "fast Fourier transform",
    "spectral analysis",
    "power spectral density",
    "signal processing",
    "MKL",
    "CuPy",
    "GPU",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/openfluids/fftkit"
Repository = "https://github.com/openfluids/fftkit"
Issues = "https://github.com/openfluids/fftkit/issues"

[project.optional-dependencies]
# Optional accelerators. Every backend is probed at import time and degrades
# to "unavailable" rather than failing, so none of these are required.
mkl = ["mkl_fft"]
gpu = ["cupy", "torch"]
# benchmarks/ only - never imported by the library itself.
bench = ["matplotlib>=3.7", "tabulate>=0.9"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fftkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/fftkit",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[dependency-groups]
test = [
    "pytest>=7.0",
]
lint = [
    "ruff>=0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
