[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fftkit"
version = "0.2.0"
description = "One FFT API over many backends: scipy, numpy, Intel MKL, CuPy, PyTorch, TensorFlow, pyFFTW, Accelerate"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Ricardo Frantz", email = "rasfrantz@gmail.com" },
]
keywords = [
    "FFT",
    "fast Fourier transform",
    "spectral analysis",
    "power spectral density",
    "signal processing",
    "MKL",
    "CuPy",
    "GPU",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/openfluids/fftkit"
Repository = "https://github.com/openfluids/fftkit"
Issues = "https://github.com/openfluids/fftkit/issues"

[project.optional-dependencies]
# Optional accelerators. Every backend is probed at import time and degrades
# to "unavailable" rather than failing, so none of these are required.
mkl = ["mkl_fft"]
pyfftw = ["pyfftw"]
tensorflow = ["tensorflow"]
torch = ["torch"]
# Plain "cupy" on PyPI is a source-only sdist that triggers a full local CUDA
# toolkit compile on install. Use the prebuilt wheel matching your CUDA major
# version instead.
cuda12 = ["cupy-cuda12x"]
cuda11 = ["cupy-cuda11x"]
# Alias for the cuda12 wheel set, kept for a short, memorable install command.
gpu = ["cupy-cuda12x"]
# CPU-installable backends only; the cuda* extras are hardware-specific and
# would fail to install (or install the wrong CUDA major) on a machine
# without a matching GPU/toolkit, so they are deliberately excluded here.
all = ["mkl_fft", "pyfftw", "torch"]
# benchmarks/ only - never imported by the library itself.
bench = ["matplotlib>=3.7", "tabulate>=0.9"]

[project.scripts]
fftkit = "fftkit.__main__:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fftkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/fftkit",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# Floors here are deliberately recent. An unbounded "ruff" or "pytest>=7.0"
# lets a years-old tool satisfy the group, so CI can pass with a linter that
# never learned the rules this project relies on. These track the current
# releases and are bumped by Dependabot.
[dependency-groups]
test = [
    "pytest>=8.4",
    "hypothesis>=6.130",
    "pytest-cov>=6.0",
]
lint = [
    "ruff>=0.16",
]
typecheck = [
    "mypy>=1.18",
    # scipy ships no inline types; without stubs mypy sees Any across every
    # scipy call and --strict passes for the wrong reason.
    "scipy-stubs>=1.16",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
# Warnings are failures. A DeprecationWarning from numpy or scipy is the
# earliest signal that an upstream API is going away, and it is worthless if it
# scrolls past in a green run. Tests that expect a warning assert it with
# pytest.warns, so nothing here needs a blanket exemption.
filterwarnings = [
    "error",
    # pytest itself may surface unraisable-exception noise from C extensions
    # during interpreter shutdown; that is not ours to fix and not a signal.
    "default::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.report]
show_missing = true
# A floor, not a target. Measured 93% on a clean scipy+numpy environment (what
# CI's default job runs) and 94% with mkl and pyfftw installed; 90 leaves room
# for platform variation -- macOS reaches the Accelerate path, Linux cannot --
# while still failing if a change drops real coverage.
fail_under = 90
exclude_also = [
    # Script entry guards are unreachable when a module is imported, which is
    # how every test loads it. Covering them would mean spawning subprocesses
    # to assert print() output, which tests the shell, not the library.
    "if __name__ == .__main__.:",
]
