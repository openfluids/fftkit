name: Release

# Publishes to PyPI via trusted publishing (OIDC) — no API token is stored.
# The PyPI publisher for this project is configured against:
#   owner: openfluids | repo: fftkit | workflow: release.yml | environment: pypi
# Changing this file's name or the environment below breaks that match.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      # Required to mint the OIDC token PyPI verifies. Nothing else is needed:
      # the default read-only GITHUB_TOKEN scope still applies to the repo.
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      # Guards against tagging v0.2.0 while pyproject.toml still says 0.1.0 —
      # PyPI would happily accept the mismatch and the tag would lie.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match pyproject.toml version $pkg" >&2
            exit 1
          fi
          echo "Tag and package version agree: $pkg"

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # `always` so a missing OIDC token fails loudly instead of silently
      # falling back to looking for a password.
      - name: Publish
        run: uv publish --trusted-publishing always
