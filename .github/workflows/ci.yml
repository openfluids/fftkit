name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dependency lists live in pyproject.toml's [dependency-groups] and are
# installed here with `uv sync`. They used to be spelled out per job as
# `pip install pytest hypothesis ...`, duplicated across four jobs; the day
# tests/test_properties.py started importing hypothesis, three of those four
# lists were wrong and every test job failed at collection. Declaring the
# dependency once and syncing it is what prevents that class of failure.

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Sync environment
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      # src/fftkit/py.typed advertises this package as typed. Without this step
      # that claim is unenforced and drifts on the first unannotated addition.
      - name: Type check
        run: uv run mypy --strict src/fftkit/ --config-file mypy.ini

      # uv.lock must stay consistent with pyproject.toml, or `uv sync` in the
      # other jobs silently installs something the manifest no longer asks for.
      - name: Lock file is in sync
        run: uv lock --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # macOS exercises the Accelerate backend path, which cannot run on Linux.
          - os: macos-26
            python-version: "3.14"
          # Windows gets a single Python version: it's here to catch
          # path/newline-handling regressions, not to be a full matrix leg.
          - os: windows-2022
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run pytest -v --cov=fftkit --cov-report=term-missing | tee pytest-output.txt
          {
            echo "### Coverage summary (${{ matrix.os }}, Python ${{ matrix.python-version }})"
            echo '```'
            tail -n 20 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # The core package must work with numpy + scipy alone. Optional backends
      # (mkl, cupy, torch, tensorflow, pyfftw) are absent here on purpose: this
      # asserts they degrade to "unavailable" instead of breaking the import.
      - name: Import without optional backends
        run: uv run python -c "import fftkit; print(fftkit.__version__, sorted(fftkit.get_available_backends()))"

  # Cross-backend agreement tests only parametrize over backends that are
  # actually importable. The jobs above install none of the optional
  # accelerators, so those tests have only ever compared scipy against
  # numpy - every other backend's numerics went unchecked. This job installs
  # the CPU-only optional backends so the agreement suite exercises them too.
  test-backends:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # pyfftw, mkl_fft and tensorflow-cpu come from the `backends` dependency
      # group, so they resolve from uv.lock and this job installs the same
      # versions every run. They used to be a bare `uv pip install` line here,
      # which is how tensorflow came to be absent for an entire release: an
      # undeclared dependency is nobody's responsibility to keep.
      - name: Sync environment with the optional backends
        run: uv sync --group backends

      - name: Install torch from the CPU index
        run: |
          # Not in the `backends` group: the PyPI wheel bundles the whole CUDA
          # stack, gigabytes of it, for a runner with no GPU. Only PyTorch's own
          # index publishes a CPU-only build, and a per-package index URL cannot
          # be expressed in a dependency group.
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      # A hard gate, not a print. Without this the job can go green having
      # installed nothing: the backend parametrization skips what is missing,
      # so a silent install failure removes exactly the tests this job exists
      # to run and still reports success.
      # --no-sync is load-bearing. `uv run` re-syncs to the DEFAULT groups first,
      # and `backends` is not one of them, so a plain `uv run` would uninstall
      # the very backends this job just installed -- torch included, which is
      # outside the lock entirely.
      - name: Require the backends this job exists to exercise
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          import fftkit

          required = {"scipy", "numpy", "mkl", "pyfftw", "torch", "tensorflow"}
          available = set(fftkit.get_available_backends())
          print("available backends:", sorted(available))
          missing = sorted(required - available)
          if missing:
              sys.exit(
                  f"FAIL: required backends did not load: {missing}\n"
                  "This job exists so the cross-backend agreement tests run against more "
                  "than scipy+numpy.\nA missing backend silently removes those tests, so "
                  "this is a failure rather than a skip."
              )
          PY

      - name: Run tests
        run: uv run --no-sync pytest -v

      # Prove the agreement tests actually ran against the optional backends
      # rather than being skipped, by counting non-skipped backend-parametrized
      # tests for each one.
      - name: Confirm optional backends were exercised
        run: |
          for b in mkl pyfftw torch tensorflow; do
            n=$(uv run --no-sync pytest -q -k "$b" --no-header 2>/dev/null | tail -1)
            echo "$b: $n"
          done
        shell: bash

  # Nothing else in this workflow pins the floors declared in pyproject.toml's
  # [project.dependencies]. This job installs exactly those floors to catch
  # accidental use of newer-numpy/scipy-only APIs.
  test-minversion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # numpy 1.24 has no wheels for Python 3.13/3.14, and building it from
      # source fails on 3.12+ because distutils was removed from the stdlib.
      # 3.11 is the newest interpreter that can install both pinned floors.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync environment
        run: uv sync --python 3.11

      # Downgrade AFTER syncing: uv.lock pins current numpy/scipy, and this job
      # exists to prove the declared floors still work, not the locked versions.
      - name: Pin the declared dependency floors
        run: uv pip install "numpy==1.24.*" "scipy==1.10.*"

      # --no-sync on every uv run below is load-bearing. `uv run` re-syncs the
      # environment to uv.lock before executing, which silently reverts the
      # downgrade above: this job once reported numpy 2.4.6 / scipy 1.17.1 while
      # its step names claimed to be testing 1.24 / 1.10, and passed.
      #
      # Asserted rather than printed for the same reason. A job that prints the
      # versions it tested is only as good as whoever reads the log; if the pin
      # stops working, this must fail rather than quietly test something else.
      - name: Assert the floors are actually installed
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          import numpy, scipy

          expected = {"numpy": "1.24", "scipy": "1.10"}
          actual = {"numpy": numpy.__version__, "scipy": scipy.__version__}
          print("versions under test:", actual)
          wrong = {
              name: got for name, got in actual.items()
              if not got.startswith(expected[name] + ".")
          }
          if wrong:
              sys.exit(
                  f"FAIL: this job exists to test the floors declared in "
                  f"pyproject.toml, but got {wrong} instead of {expected}.\n"
                  "Most likely a `uv run` without --no-sync re-synced the "
                  "environment back to uv.lock."
              )
          PY

      - name: Run tests
        run: uv run --no-sync pytest -v

  # The matrix above syncs from uv.lock, which is the right default for
  # reproducibility but means CI stops seeing a brand-new numpy or scipy the day
  # it ships. Users install fftkit unpinned, so "latest" is their real
  # environment: this job re-resolves everything to the newest compatible
  # release and ignores the lock.
  #
  # Deliberately blocking rather than continue-on-error. A canary nobody has to
  # fix is a canary nobody reads, and shipping a library that breaks against
  # current numpy is worse than a red build that names the reason.
  test-latest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Resolve newest compatible dependencies
        run: uv sync --upgrade

      - name: Show versions under test
        run: uv run python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

      - name: Run tests
        run: uv run pytest -v

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Build
        run: uv build

      - name: Check package
        run: uvx twine check dist/*
